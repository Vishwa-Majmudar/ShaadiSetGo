
name: ShaadiSetGo CI/CD

on:
  push:
    branches:
      - devops-ci-cd

  pull_request:
    branches:
      - main
      - devops-ci-cd

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  frontend-checks:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    needs:
      - backend-checks
      - frontend-checks

    # Never deploy from a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/devops-ci-cd'

    steps:
      - name: Deploy backend
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK" || {
            echo "Backend deploy hook secret is missing."
            exit 1
          }
          curl --fail --silent --show-error \
            --request POST "$DEPLOY_HOOK"

      - name: Deploy frontend
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK" || {
            echo "Frontend deploy hook secret is missing."
            exit 1
          }
          curl --fail --silent --show-error \
            --request POST "$DEPLOY_HOOK"
