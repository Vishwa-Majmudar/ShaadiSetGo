name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Test backend
        working-directory: backend
        run: |
          npm ci
          npm test -- --testTimeout=120000

      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

  publish:
    name: Publish Docker images
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/vishwa-majmudar/shaadisetgo-backend:${{ github.sha }}
            ghcr.io/vishwa-majmudar/shaadisetgo-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_BASE_URL=
          tags: |
            ghcr.io/vishwa-majmudar/shaadisetgo-frontend:${{ github.sha }}
            ghcr.io/vishwa-majmudar/shaadisetgo-frontend:latest

  deploy:
    name: Deploy to server
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Update production server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            export GHCR_OWNER="vishwa-majmudar"
            export IMAGE_TAG="${{ github.sha }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            sleep 10
            curl --fail --silent --show-error http://localhost/health > /dev/null
            docker image prune -af --filter "until=168h"
